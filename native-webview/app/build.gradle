import java.util.Properties

plugins {
    id 'com.android.application'
}

def privateProperties = new Properties()
def privatePropertiesFile = rootProject.file('local.properties')
if (privatePropertiesFile.exists()) {
    privatePropertiesFile.withInputStream { privateProperties.load(it) }
}
def tmdbApiKey = privateProperties.getProperty('TMDB_API_KEY', '')
def tmdbApiKeyEscaped = tmdbApiKey.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.ultraplayer.app'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.ultraplayer.app'
        minSdk 21
        targetSdk 28
        versionCode 153
        versionName '5.8.0'
        buildConfigField 'String', 'TMDB_API_KEY', '"' + tmdbApiKeyEscaped + '"'
    }

    signingConfigs {
        debug {
            // IMPORTANTE: sem isso, o Gradle usa o debug.keystore IMPLÍCITO do
            // Android (~/.android/debug.keystore), que cada máquina/runner do
            // GitHub Actions gera do ZERO e DIFERENTE a cada build limpo. Como
            // o MAC do app (appMac() em MainActivity.java) é derivado do
            // ANDROID_ID, que a partir do Android 8 é isolado por chave de
            // assinatura do app, cada build novo do CI mudava o MAC de todo
            // mundo E impedia instalar por cima (Android bloqueia update com
            // assinatura diferente — teria que desinstalar sempre). Apontando
            // pra um keystore FIXO e commitado no repo, toda build (local ou
            // no Actions) usa a MESMA assinatura: mesmo MAC, instala por cima.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // APK otimizado: R8 remove bytecode não utilizado e reduz recursos.
            minifyEnabled true
            shrinkResources true
            // Mantém a mesma assinatura de teste para atualizar instalações debug.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}

